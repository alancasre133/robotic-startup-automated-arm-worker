<svg viewBox="0 0 840 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="840" height="620" rx="14" fill="#F7F6F3"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1A1A1A">Robot Car — Wiring Overview</text>
  <text x="30" y="62" font-size="13" fill="#6B7280">Raspberry Pi 3 drives two DC motors through an L9110S. Motors run off the AA pack; the Pi off the power bank.</text>

  <!-- Power Bank -->
  <rect x="70" y="86" width="190" height="72" rx="10" fill="#FFFFFF" stroke="#E8843A" stroke-width="2"/>
  <text x="165" y="116" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Power Bank</text>
  <text x="165" y="136" font-size="12" fill="#6B7280" text-anchor="middle">5V USB &#183; powers Pi</text>

  <!-- AA Battery -->
  <rect x="580" y="86" width="190" height="72" rx="10" fill="#FFFFFF" stroke="#E8843A" stroke-width="2"/>
  <text x="675" y="116" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">4 &#215; AA Battery</text>
  <text x="675" y="136" font-size="12" fill="#6B7280" text-anchor="middle">~6V &#183; powers motors</text>

  <!-- Raspberry Pi -->
  <rect x="70" y="266" width="210" height="120" rx="10" fill="#FFFFFF" stroke="#3F76D0" stroke-width="2"/>
  <text x="175" y="312" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Raspberry Pi 3</text>
  <text x="175" y="334" font-size="12" fill="#6B7280" text-anchor="middle">Model A+ &#183; Trixie</text>
  <text x="175" y="354" font-size="12" fill="#6B7280" text-anchor="middle">GPIO control</text>

  <!-- L9110S -->
  <rect x="560" y="266" width="210" height="120" rx="10" fill="#FFFFFF" stroke="#3F76D0" stroke-width="2"/>
  <text x="665" y="312" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">L9110S Driver</text>
  <text x="665" y="334" font-size="12" fill="#6B7280" text-anchor="middle">dual H-bridge</text>
  <text x="665" y="354" font-size="12" fill="#6B7280" text-anchor="middle">Motor A + Motor B</text>

  <!-- Motor A -->
  <rect x="500" y="486" width="120" height="78" rx="10" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
  <text x="560" y="520" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Motor A</text>
  <text x="560" y="540" font-size="12" fill="#6B7280" text-anchor="middle">left wheel</text>

  <!-- Motor B -->
  <rect x="700" y="486" width="120" height="78" rx="10" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
  <text x="760" y="520" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Motor B</text>
  <text x="760" y="540" font-size="12" fill="#6B7280" text-anchor="middle">right wheel</text>

  <!-- Planned Pico + Arm -->
  <rect x="70" y="486" width="210" height="78" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="175" y="516" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Pico W + 6-DOF Arm</text>
  <text x="175" y="536" font-size="12" fill="#9CA3AF" text-anchor="middle">planned add-on</text>

  <!-- Power bank -> Pi -->
  <line x1="165" y1="158" x2="165" y2="266" stroke="#E8843A" stroke-width="2.5"/>
  <text x="175" y="216" font-size="12" font-weight="600" fill="#E8843A">USB 5V</text>

  <!-- AA -> L9110S -->
  <line x1="675" y1="158" x2="675" y2="266" stroke="#E8843A" stroke-width="2.5"/>
  <text x="685" y="204" font-size="12" font-weight="600" fill="#E8843A">+6V &#8594; VCC</text>
  <text x="685" y="221" font-size="12" font-weight="600" fill="#E8843A">&#8722; &#8594; GND</text>

  <!-- Pi -> L9110S (signals) -->
  <line x1="280" y1="312" x2="560" y2="312" stroke="#3F76D0" stroke-width="2.5"/>
  <text x="420" y="300" font-size="12" font-weight="600" fill="#3F76D0" text-anchor="middle">4 GPIO signals + GND</text>
  <text x="420" y="332" font-size="11" fill="#6B7280" text-anchor="middle">GPIO 16,20 &#8594; A &#183; 27,22 &#8594; B</text>

  <!-- L9110S -> Motors -->
  <line x1="610" y1="386" x2="560" y2="486" stroke="#2E9E5B" stroke-width="2.5"/>
  <line x1="720" y1="386" x2="760" y2="486" stroke="#2E9E5B" stroke-width="2.5"/>
  <text x="648" y="442" font-size="11" font-weight="600" fill="#2E9E5B">motor +/&#8722;</text>

  <!-- Pi -> Pico (planned) -->
  <line x1="175" y1="386" x2="175" y2="486" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="185" y="440" font-size="11" fill="#9CA3AF">USB</text>

  <!-- Legend -->
  <text x="30" y="597" font-size="11" fill="#6B7280">Legend:</text>
  <rect x="84" y="589" width="14" height="10" fill="#E8843A"/><text x="104" y="598" font-size="11" fill="#6B7280">power</text>
  <rect x="152" y="589" width="14" height="10" fill="#3F76D0"/><text x="172" y="598" font-size="11" fill="#6B7280">signal/GND</text>
  <rect x="246" y="589" width="14" height="10" fill="#2E9E5B"/><text x="266" y="598" font-size="11" fill="#6B7280">motor</text>
  <rect x="312" y="589" width="14" height="10" fill="#9CA3AF" stroke-dasharray="3 2"/><text x="332" y="598" font-size="11" fill="#6B7280">planned</text>
</svg>
