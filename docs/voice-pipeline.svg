<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="14" fill="#F7F6F3"/>
  <text x="28" y="38" font-size="23" font-weight="700" fill="#1A1A1A">Voice Assistant Pipeline</text>
  <text x="28" y="60" font-size="13" fill="#6B7280">mic → speech-to-text → Claude (brain) → speak + act → listen again</text>

  <!-- flow arrows (drawn first) -->
  <line x1="174" y1="222" x2="206" y2="222" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="372" y1="222" x2="404" y2="222" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="198" x2="686" y2="146" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="246" x2="686" y2="332" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- loop back -->
  <path d="M 783 380 L 783 442 L 99 442 L 99 268" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowdash)"/>
  <text x="441" y="436" font-size="11" fill="#9CA3AF" text-anchor="middle">listen again</text>

  <!-- Mic -->
  <rect x="24" y="180" width="150" height="84" rx="10" fill="#FFFFFF" stroke="#3F76D0" stroke-width="2"/>
  <text x="99" y="212" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Microphone</text>
  <text x="99" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">INMP441 (I²S)</text>
  <text x="99" y="248" font-size="11.5" fill="#6B7280" text-anchor="middle">hears you</text>

  <!-- STT -->
  <rect x="212" y="180" width="160" height="84" rx="10" fill="#FFFFFF" stroke="#3F76D0" stroke-width="2"/>
  <text x="292" y="212" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Speech-to-Text</text>
  <text x="292" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">audio → words</text>
  <text x="292" y="248" font-size="11.5" fill="#6B7280" text-anchor="middle">Vosk / Whisper</text>

  <!-- Claude brain -->
  <rect x="410" y="160" width="190" height="124" rx="11" fill="#FFFFFF" stroke="#7C5CD0" stroke-width="2.5"/>
  <text x="505" y="196" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Claude (brain)</text>
  <text x="505" y="216" font-size="11.5" fill="#6B7280" text-anchor="middle">decides: talk or act</text>
  <text x="505" y="240" font-size="11.5" fill="#7C5CD0" text-anchor="middle">via WiFi (cloud)</text>
  <text x="505" y="262" font-size="11.5" fill="#6B7280" text-anchor="middle">tools: drive · move arm</text>

  <!-- Speak -->
  <rect x="690" y="96" width="186" height="80" rx="10" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
  <text x="783" y="128" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Speak reply</text>
  <text x="783" y="148" font-size="11.5" fill="#6B7280" text-anchor="middle">TTS → MAX98357</text>
  <text x="783" y="164" font-size="11.5" fill="#6B7280" text-anchor="middle">speaker</text>

  <!-- Act -->
  <rect x="690" y="300" width="186" height="80" rx="10" fill="#FFFFFF" stroke="#D98A2B" stroke-width="2"/>
  <text x="783" y="332" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Act</text>
  <text x="783" y="352" font-size="11.5" fill="#6B7280" text-anchor="middle">drive motors /</text>
  <text x="783" y="368" font-size="11.5" fill="#6B7280" text-anchor="middle">move the arm</text>

  <!-- legend -->
  <rect x="28" y="86" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#3F76D0" stroke-width="2"/><text x="48" y="97" font-size="11.5" fill="#6B7280">input</text>
  <rect x="110" y="86" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#7C5CD0" stroke-width="2"/><text x="130" y="97" font-size="11.5" fill="#6B7280">cloud brain</text>
  <rect x="224" y="86" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/><text x="244" y="97" font-size="11.5" fill="#6B7280">speak</text>
  <rect x="300" y="86" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#D98A2B" stroke-width="2"/><text x="320" y="97" font-size="11.5" fill="#6B7280">act</text>
</svg>
